name: Data Validation

on:
  push:
    paths:
      - "data/**"
      - "src/ercot_rtcb_bench/data/schema.py"
      - "src/ercot_rtcb_bench/data/validate.py"
  pull_request:
    paths:
      - "data/**"
      - "src/ercot_rtcb_bench/data/schema.py"
      - "src/ercot_rtcb_bench/data/validate.py"

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run schema tests
        run: pytest tests/test_schema.py tests/test_data_validation.py -v
