[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ercot-rtcb-bench"
version = "0.1.0"
description = "Open benchmark for battery bidding under ERCOT RTC+B"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Karthik Mattu", email = "km5503@g.rit.edu" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
fetch = [
    "gridstatus>=0.35.0",
    "requests>=2.31",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pandas-stubs>=2.0",
    "types-requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ercot_rtcb_bench"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
